name             = "rendering"
platform         = "atari"
serial           = "/tmp/altirra-tty"
mycall           = "NOCALL"

[[step]]
description      = "a sender with no digipeaters"
to_kisstty       = "NOCALL-7>APKTY1::NOCALL   :No digis"
look_for         = "NOCALL-7>NOCALL:No digis"

[[step]]
description      = "a sender with one digipeater"
to_kisstty       = "NOCALL-3>APKTY1,WIDE2-1::NOCALL   :One digi"
look_for         = "NOCALL-3>NOCALL:One digi"

[[step]]
description      = "a single digit sender ssid"
to_kisstty       = "NOCALL-9>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Single digit ssid"
look_for         = "NOCALL-9>NOCALL:Single digit ssid"

[[step]]
description      = "a two digit sender ssid"
to_kisstty       = "NOCALL-10>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Two digit ssid"
look_for         = "NOCALL-10>NOCALL:Two digit ssid"

[[step]]
description      = "a sender with no ssid gets no trailing dash"
to_kisstty       = "NOCAL2>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Sender with no ssid"
look_for         = "NOCAL2>NOCALL:Sender with no ssid"

[[step]]
description      = "a full nine char addressee has no padding to trim"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL-15:Nine char addressee"
look_for         = [
  "NOCALL-7>NOCALL-15:Nine char addressee",
  "it fills line 1 exactly",
]

[[step]]
description      = "a body that runs past one line wraps"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :This message should end mid line 2, my dude!"
look_for         = "wraps onto a second line and stops part way along it"

[[step]]
description      = "a longer sender ssid pushes the wrap one column over"
to_kisstty       = "NOCALL-15>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :This message should end mid line 2, my dude!"
look_for         = "the same wrap, one column further over"

[[step]]
description      = "a body sized to the last column does not spill"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Fill up this second line all the way out to its very end!!!!"
look_for         = "line 2 filled to its last column, nothing on a third"
