name             = "line-endings"
platform         = "atari"
serial           = "/tmp/altirra-tty"

# Every step drives the serial device directly, so the runner does not start
# direwolf and there is no callsign to set. socat has to be running, and the
# device can be overridden with the runner's second argument for real hardware.

[[step]]
description      = "setup"
do               = 'put kisstty in terminal mode: Session tab, Protocol = Terminal. Then Term tab, Mode = Char and Line ending = CR. Enter when the terminal screen is up and empty'

[[step]]
description      = "a crlf remote ends a line without leaving a stray glyph"
to_serial        = 'AB\r\nCD\r\n'
look_for         = [
  "AB on one line and CD on the next",
  "no blank line between them and no extra character after either",
]

[[step]]
description      = "a bare lf remote ends a line, which is the raw mode unix case"
to_serial        = 'LF ONE\nLF TWO\n'
look_for         = "LF ONE and LF TWO on consecutive lines, nothing blank between"

[[step]]
description      = "a bare cr remote ends a line, which is the tnc case"
to_serial        = 'CR ONE\rCR TWO\r'
look_for         = "CR ONE and CR TWO on consecutive lines, nothing blank between"

[[step]]
description      = "an atascii remote ends a line on 9b"
to_serial        = 'ATASCII ONE\x9bATASCII TWO\x9b'
look_for         = "ATASCII ONE and ATASCII TWO on consecutive lines"

[[step]]
description      = "endings can change mid stream without being configured for"
to_serial        = 'mixed cr\rmixed lf\nmixed crlf\r\nmixed done\r\n'
look_for         = "all four mixed lines on consecutive lines, none blank, none merged"

[[step]]
description      = "the tail of a pair is dropped in either order"
to_serial        = 'lfcr one\n\rlfcr two\n\r'
look_for         = "lfcr one and lfcr two on consecutive lines, nothing blank between"

[[step]]
description      = "a repeat of the same terminator is a deliberate blank line"
to_serial        = 'gap crlf A\r\n\r\ngap crlf B\r\n'
look_for         = "exactly one blank line between gap crlf A and gap crlf B"

[[step]]
description      = "a repeated bare cr gives the same blank line as a repeated crlf"
to_serial        = 'gap cr A\r\rgap cr B\r'
look_for         = "exactly one blank line between gap cr A and gap cr B"

[[step]]
description      = "several blank lines in a row all survive"
to_serial        = 'three A\r\n\r\n\r\n\r\nthree B\r\n'
look_for         = "exactly three blank lines between three A and three B"

[[step]]
description      = "a line filling the last column is not followed by a blank line"
to_serial        = '12345678901234567890123456789012345678\r\nAFTER\r\n'
look_for         = [
  "the digits fill one line right out to its last column",
  "AFTER is on the very next line, with no blank line between",
]

[[step]]
description      = "one char past the last column wraps before the ending is seen"
to_serial        = '12345678901234567890123456789012345678X\r\nAFTER\r\n'
look_for         = [
  "the digits fill one line, X sits alone on the next",
  "AFTER is on the line below X, with no blank line anywhere",
]

[[step]]
description      = "a blank line after a full line still comes out as one blank line"
to_serial        = '12345678901234567890123456789012345678\r\n\r\nAFTER\r\n'
look_for         = [
  "the digits fill one line",
  "exactly one blank line between the digits and AFTER",
]

[[step]]
description      = "two full lines back to back get no blank line between them"
to_serial        = '1234567890123456789012345678901234567812345678901234567890123456789012345678\r\nAFTER\r\n'
look_for         = [
  "two identical full lines of digits, one directly under the other",
  "AFTER on the line below them, nothing blank anywhere",
]

[[step]]
description      = "the pair tail is still dropped when the line was already full"
to_serial        = '12345678901234567890123456789012345678\n\rAFTER\r\n'
look_for         = [
  "the digits fill one line and AFTER is on the very next one",
  "no blank line, so the trailing cr after the lf was dropped",
]

[[step]]
description      = "clear the screen for the cases that need the bottom row"
do               = "press HOME in altirra, which is the atari CLEAR key (shift+<), and should blank the whole text area and put the cursor back at the top"
look_for         = "the text area is completely empty"

[[step]]
description      = "filling the bottom row does not scroll on its own"
to_serial        = ['L1\r\nL2\r\nL3\r\nL4\r\nL5\r\nL6\r\nL7\r\nL8\r\nL9\r\nL10\r\nL11\r\nL12\r\nL13\r\nL14\r\nL15\r\nL16\r\nL17\r\nL18\r\nL19\r\nL20\r\n', '12345678901234567890123456789012345678']
look_for         = [
  "L1 is still on the top row, so nothing has scrolled",
  "the bottom row is full of digits out to its last column",
]

[[step]]
description      = "the char after a full bottom row is what forces the scroll"
to_serial        = 'X'
look_for         = [
  "the display scrolled by exactly one line, L1 is gone and L2 is on top",
  "X sits alone on the bottom row",
]

[[step]]
description      = "clear the screen again"
do               = "press HOME in altirra again to clear the text area"
look_for         = "the text area is completely empty"

[[step]]
description      = "an ending after a full bottom row scrolls exactly once"
to_serial        = ['L1\r\nL2\r\nL3\r\nL4\r\nL5\r\nL6\r\nL7\r\nL8\r\nL9\r\nL10\r\nL11\r\nL12\r\nL13\r\nL14\r\nL15\r\nL16\r\nL17\r\nL18\r\nL19\r\nL20\r\n', '12345678901234567890123456789012345678', '\r']
look_for         = [
  "the display scrolled by exactly one line, L1 is gone and L2 is on top",
  "L20 then the digits, and then a blank last row where the cursor now sits",
]

[[step]]
description      = "char mode sends the configured ending on return, not atascii 9b"
do               = "with Line ending still CR and Mode still Char, press RETURN once in kisstty"
from_serial      = '\r'

[[step]]
description      = "line mode sends the line then the ending"
do               = "set Mode = Line, type AB and press RETURN"
from_serial      = 'AB\r'

[[step]]
description      = "the lf setting sends one byte"
do               = "set Line ending = LF, type AB and press RETURN"
from_serial      = 'AB\n'

[[step]]
description      = "the crlf setting sends both bytes in order"
do               = "set Line ending = CRLF, type AB and press RETURN"
from_serial      = 'AB\r\n'

[[step]]
description      = "the atascii setting sends 9b"
do               = "set Line ending = ATASCII, type AB and press RETURN"
from_serial      = 'AB\x9b'

[[step]]
description      = "the send setting does not change how receive is read"
to_serial        = 'still crlf A\r\nstill crlf B\r\n'
look_for         = [
  "still crlf A and still crlf B on consecutive lines",
  "the crlf remote still renders correctly even though ATASCII is selected",
]
