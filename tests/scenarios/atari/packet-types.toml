name             = "unhandled packet types"
mycall           = "NOCALL"

# pk_process_frame only dispatches on ':', and status parsing is commented out,

# so none of these render. What we are checking is that they arrive, get

# ignored, and leave the message path working.

[[step]]
description      = "a message renders, so the path is working"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Before the unhandled"
look_for         = "NOCALL-7>NOCALL:Before the unhandled"

[[step]]
description      = "position reports are not parsed yet"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1:!4433.37N/12318.23W-kisstty dev test"
look_for         = "nothing"

[[step]]
description      = "weather reports are not parsed yet"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1:@111111z4433.37N/12318.23W_270/005g010t065r000p000b10150h65"
look_for         = "nothing"

[[step]]
description      = "mic-e is not parsed yet"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1:`kisstty dev test"
look_for         = "nothing"

[[step]]
description      = "status parsing is commented out"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1:>kisstty dev test"
look_for         = "nothing"

[[step]]
description      = "a zulu timestamp does not change that"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1:>092345zkisstty dev test"
look_for         = "nothing"

[[step]]
description      = "an empty status does not crash"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1:>"
look_for         = "nothing"

[[step]]
description      = "the message path still works after all of them"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :After the unhandled"
look_for         = "NOCALL-7>NOCALL:After the unhandled"
