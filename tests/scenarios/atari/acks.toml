name             = "acks"
platform         = "atari"
serial           = "/tmp/altirra-tty"
mycall           = "NOCALL"

[[step]]
description      = "we send a message with an id"
do               = '/tx NOCALL-7 then send "hello there"'
from_kisstty     = "::NOCALL-7 :hello there{0001"
look_for         = "NOCALL>NOCALL-7:hello there#0001"

[[step]]
description      = "an ack for a message we sent shows only on the status bar"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :ack0001"
look_for         = "no new line, and 'ack:+' on the bar"

[[step]]
description      = "a message addressed to us is acked automatically"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Test message{0002"
from_kisstty     = "::NOCALL-7 :ack0002"
look_for         = "NOCALL-7>NOCALL:Test message#0002"

[[step]]
description      = "a two digit ssid pads the addressee to its full nine chars"
to_kisstty       = "NOCALL-15>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Two digit ssid{0003"
from_kisstty     = "::NOCALL-15:ack0003"
look_for         = "NOCALL-15>NOCALL:Two digit ssid#0003"

[[step]]
description      = "a message with no id is not ackable"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :No id to ack"
not_from_kisstty = "::NOCALL-7 :ack"
look_for         = "NOCALL-7>NOCALL:No id to ack"

[[step]]
description      = "a brace with nothing after it is not an id"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Bare brace{"
not_from_kisstty = "::NOCALL-7 :ack"
look_for         = "NOCALL-7>NOCALL:Bare brace, with no #"

[[step]]
description      = "an ack addressed to another station is not ours to show"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL-9 :ack0001"
look_for         = "nothing new on screen"

[[step]]
description      = "five chars is the longest id an ack can carry, so this parses as an ack"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :ack12345"
look_for         = "nothing new on screen"

[[step]]
description      = "six chars is too long, so it parses as a plain message"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :ack123456"
look_for         = "NOCALL-7>NOCALL:ack123456"
