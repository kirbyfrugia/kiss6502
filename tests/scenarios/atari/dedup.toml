name             = "dedup"
platform         = "atari"
serial           = "/tmp/altirra-tty"
mycall           = "NOCALL"

# These have to land inside one 30s window, so they go out as a list with no

# prompt in between. A prompt there would let the window expire while you type

# and the duplicates would legitimately show.

[[step]]
description      = "a repeat is the same message whatever path it took"
to_kisstty       = [
  "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Repeat me",
  "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Repeat me",
  "NOCALL-7>APKTY1,WIDE2-1::NOCALL   :Repeat me",
  "NOCALL-7>APKTY1::NOCALL   :Repeat me",
  "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Repeat me too",
]
look_for         = "two lines only, one 'Repeat me' and one 'Repeat me too'"

[[step]]
description      = "let the dedup window expire"
wait             = 35

[[step]]
description      = "the window is a time limit, not a permanent record"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :Repeat me"
look_for         = "'Repeat me' again"
# Our own traffic coming back is dropped as soon as kisstty sees itself as the

# source, before the dedup check ever runs, so this last step is a different

# path from the rest of the file. It also ticks the status bar rpt: field.

# See repeats.toml.

[[step]]
description      = "our own traffic handed back by the tnc is never shown twice"
do               = 'send "echo check" to NOCALL-7'
look_for         = "exactly one line for it, and no second copy"
