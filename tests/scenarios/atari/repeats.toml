name             = "repeats"
platform         = "atari"
serial           = "/tmp/altirra-tty"
mycall           = "NOCALL"

# The status bar ack and repeat fields.

#

# Start from a freshly launched kisstty in APRS mode so the message id counter

# is still at 0001.

[[step]]
description      = "neither field shows until something has been sent"
look_for         = "'st:OK' and no ack: or rpt: anywhere on the bar"

[[step]]
description      = "sending with an id starts both fields"
do               = '/tx NOCALL-7 then send "hello there"'
from_kisstty     = "::NOCALL-7 :hello there{0001"
look_for         = [
  "NOCALL>NOCALL-7:hello there#0001",
  "'ack:_' and 'rpt:00' on the bar",
]

[[step]]
description      = "our message coming back from a digipeater is counted, not shown"
to_kisstty       = "NOCALL>APKTY1,WIDE1-1,WIDE2-1::NOCALL-7 :hello there{0001"
look_for         = "no new line, and 'rpt:01'"

[[step]]
description      = "our own frames never reach the dedup check, so identical copies each count"
to_kisstty       = "NOCALL>APKTY1,WIDE1-1,WIDE2-1::NOCALL-7 :hello there{0001"
look_for         = "no new line, and 'rpt:02'"

[[step]]
description      = "the digipeater path is not in the crc, so another route is the same message"
to_kisstty       = "NOCALL>APKTY1,WIDE2-1::NOCALL-7 :hello there{0001"
look_for         = "no new line, and 'rpt:03'"

[[step]]
description      = "an ack is only ours if the id matches the one we sent"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :ack0009"
look_for         = "no new line, and 'ack:_' unchanged"

[[step]]
description      = "the matching ack marks the message acked"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :ack0001"
look_for         = "no new line, and 'ack:+' with 'rpt:03'"

[[step]]
description      = "a message addressed to us is acked automatically"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL   :ack me back{0042"
from_kisstty     = "::NOCALL-7 :ack0042"
look_for         = "NOCALL-7>NOCALL:ack me back#0042"

[[step]]
description      = "an ack we transmitted is sourced from us too, but is not the message being tracked"
to_kisstty       = "NOCALL>APKTY1,WIDE1-1,WIDE2-1::NOCALL-7 :ack0042"
look_for         = "no new line, and 'rpt:03' unchanged"

[[step]]
description      = "a new send restarts both fields, and an auto ack does not consume an id"
do               = 'send "second message" to NOCALL-7'
from_kisstty     = "::NOCALL-7 :second message{0002"
look_for         = [
  "NOCALL>NOCALL-7:second message#0002",
  "'ack:_' and 'rpt:00'",
]

[[step]]
description      = "only the last message sent is tracked"
to_kisstty       = "NOCALL>APKTY1,WIDE1-1,WIDE2-1::NOCALL-7 :hello there{0001"
look_for         = "no new line, and 'rpt:00' unchanged"

[[step]]
description      = "the message we are tracking still counts"
to_kisstty       = "NOCALL>APKTY1,WIDE1-1,WIDE2-1::NOCALL-7 :second message{0002"
look_for         = "no new line, and 'rpt:01'"

[[step]]
description      = "a broadcast carries no id, so there is nothing to ack"
do               = '/tx with no argument, then send "beacon test"'
from_kisstty     = "::CQ       :beacon test"
look_for         = [
  "NOCALL>CQ:beacon test",
  "no ack: field at all, and 'rpt:00'",
]

[[step]]
description      = "a broadcast is still counted, with no ack to track"
to_kisstty       = "NOCALL>APKTY1,WIDE1-1,WIDE2-1::CQ       :beacon test"
look_for         = "no new line, and 'rpt:01'"

[[step]]
description      = "the rest of the bar survived all of it"
look_for         = "'st:OK', and 'tx:CQ' still in the station field"
