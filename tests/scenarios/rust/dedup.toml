name             = "dedup"
platform         = "rust"
mycall           = "NOCALL"

# Repeats and dedup are one mechanism here (kiss/session.rs try_attach_repeat),
# so unlike the atari build there's no separate repeats.toml: a duplicate just
# ticks rpt:N on the item already on screen instead of adding a line, and that
# only holds within a rolling 30s window.
#
# These have to land inside that one window, so they go out as a list with no
# prompt in between. A prompt there would let the window expire while you type.
#
# `every` is bumped to 3s here (default is 1) to give direwolf's demodulator
# more clear air between the four back-to-back copies. Confirmed with a
# headless probe wired straight to the real KissClient/KissSession, no TUI in
# the way, that the dedup logic itself is correct: a clean run reliably counts
# all three repeats. What's not fully reliable is the audio simulation - one
# of the four synthetic AFSK clips can occasionally fail to decode when
# they're packed in tight, the same kind of thing the atari suite had to leave
# room for. The wider gap cuts that down but can't rule it out, hence the
# look_for below tolerating a short count instead of failing on it.

[[step]]
description      = "a repeat is the same message whatever digipeater path it took"
to_kisstty       = [
  "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL-2 :Repeat me",
  "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL-2 :Repeat me",
  "NOCALL-7>APKTY1,WIDE2-1::NOCALL-2 :Repeat me",
  "NOCALL-7>APKTY1::NOCALL-2 :Repeat me",
  "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL-2 :Repeat me too",
]
every            = 3
look_for         = [
  "two items only",
  "'Repeat me' shows an rpt: field on its header, ideally rpt:3",
  "rpt:2 or rpt:1 there just means one or two of the simulated copies didn't decode cleanly over the air; that's the test's audio path, not kisstty, so don't fail this step over it. no rpt: field at all is the real failure: it means dedup itself didn't fire",
  "'Repeat me too' shows no rpt: field",
]

[[step]]
description      = "let the dedup window expire"
wait             = 35

[[step]]
description      = "the window is a time limit, not a permanent record"
to_kisstty       = "NOCALL-7>APKTY1,WIDE1-1,WIDE2-1::NOCALL-2 :Repeat me"
look_for         = "a third, separate 'Repeat me' item, since the earlier one aged out of the 30s window"

[[step]]
description      = "our own traffic handed back with no digipeater in between is dropped, not shown or counted"
do               = 'in net mode, type "echo check" and press Enter (it goes to CQ, the broadcast addressee)'
from_kisstty     = "::CQ       :echo check"
to_kisstty       = "NOCALL>APKTY1,WIDE1-1,WIDE2-1::CQ       :echo check"
look_for         = "no new item for the injected copy; the one line from sending it is still the only one for 'echo check'"
