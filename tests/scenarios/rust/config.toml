name             = "config"

# The Config screen itself. No step here sends or checks a packet, so this
# never touches direwolf and there's no callsign prompt for that reason.
#
# ConfigCanceled only quits if the app's last *saved* config was already
# invalid (i.e. this is the very first launch and nothing has been saved
# yet). Once a valid config exists, Cancel just returns to the main screen
# and leaves it untouched, no matter what's sitting unsaved in the fields.
# That's why the quit-on-cancel case comes before the first successful save,
# and the safe-cancel case comes after.

[[step]]
description      = "an empty or invalid config opens straight to the Config screen"
do               = "launch kisstty with no valid saved config: delete ~/.config/kisstty/config.toml first if one exists. Press Enter once the Config screen is up"
look_for         = "a centered 'Config' box with Callsign, Digipeaters, KISS host and KISS port fields, and Cancel/Save buttons. Callsign starts empty"

[[step]]
description      = "cancelling with nothing ever saved quits, rather than leaving a broken main screen"
do               = "press Esc"
look_for         = "kisstty exits back to the shell"

[[step]]
description      = "relaunch: the Config screen comes back since nothing was saved last time"
do               = "relaunch kisstty. Press Enter once the Config screen is up"
look_for         = "the Config screen again, Callsign still empty"

[[step]]
description      = "tab and shift-tab move focus forward and back through fields and buttons"
do               = "press Tab five times, then Shift+Tab once"
look_for         = [
  "each Tab moves focus Callsign -> Digipeaters -> KISS host -> KISS port -> Cancel -> Save",
  "the Shift+Tab afterward moves it back from Save to Cancel",
  "a focused field's label goes bold with a '>' marker to its left; a focused button highlights in reverse video instead",
]

[[step]]
description      = "an empty callsign is rejected on save"
do               = "focus Callsign, clear it if anything's there, tab to Save, and press Enter"
look_for         = "a red 'callsign cannot be empty' message appears, focus jumps back to Callsign, and the screen stays open"

[[step]]
description      = "an invalid callsign is rejected too"
do               = 'type "NOCALL-99" into Callsign (the field caps entry at 9 characters, which this fits exactly), tab to Save, and press Enter'
look_for         = "a red error saying it has an invalid SSID (must be 0-15), focus back on Callsign"

[[step]]
description      = "a bad kiss port is rejected"
do               = 'fix Callsign to "NOCALL", tab to KISS port, clear it, type "0", tab to Save, and press Enter'
look_for         = "a red error about the port needing to be 1-65535, focus jumps to the KISS port field"

[[step]]
description      = "a bad digipeater entry is rejected"
do               = 'fix the port back to "8001", tab to Digipeaters, type "NOTACALLSIGNATALL9999", tab to Save, and press Enter'
look_for         = "a red error saying it's not a valid callsign, focus jumps to Digipeaters"

[[step]]
description      = "valid values save and return to the main screen"
do               = 'clear Digipeaters, confirm Callsign "NOCALL", KISS host "127.0.0.1", KISS port "8001", tab to Save, and press Enter'
look_for         = "the Config screen closes and the main kisstty screen appears"

[[step]]
description      = "/config reopens it with the saved values already filled in"
do               = 'type "/config" and press Enter'
look_for         = "Callsign NOCALL, KISS host 127.0.0.1, KISS port 8001, Digipeaters blank"

[[step]]
description      = "cancel now just discards edits, since a valid config already exists"
do               = 'change Callsign to something else, then press Esc'
look_for         = [
  "back on the main screen, not exited",
  "reopening /config shows Callsign is still NOCALL, unchanged by the edit you cancelled",
]
