name             = "soak"
mycall           = "NOCALL"

# Runs until you interrupt it, so there is nothing after the traffic step.
# A trailing look_for would never be reached.

[[step]]
description      = "get set up before the traffic starts"
do               = "get kisstty on screen, then press Enter to start a message every 5s from a random station. Press q to stop it, or ctrl-c to quit outright. Watch for torn lines, bad wrapping, a stuck scrollbar or a lockup"

[[step]]
description      = "random traffic until you interrupt it"
random           = true
repeat           = 0
every            = 3
