[package]
name = "packet-injector"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fires one simulated APRS packet at a running kisstty, so you can eyeball how it renders"

[dependencies]
kisstty-harness = { path = "../harness" }
ctrlc = "3"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[dev-dependencies]
tempfile = "3"
