# Protocol tests: exercise packet decode/parsing correctness. Named by input
# (what the packet IS). Any packet type belongs here if the point is correct
# parsing rather than display behavior. A type with more than one test gets
# its own subdirectory; a singleton stays here.
title = "Protocol decode"
description = "Packet parsing/decode correctness across APRS packet types"

[[test]]
name = "position"
label = "Position report"
description = "Standard uncompressed position report with symbol and comment text"
packet = "NOCALL-7>APZ001,WIDE1-1,WIDE2-1:!4433.37N/12318.23W-kisstty dev test"

[[test]]
name = "weather"
label = "Weather report"
description = "Positioned weather report: wind 270 deg at 5kt gusting 10, 65F, 65% humidity"
packet = "NOCALL-7>APZ001,WIDE1-1,WIDE2-1:@111111z4433.37N/12318.23W_270/005g010t065r000p000b10150h65"

[[test]]
name = "mic-e"
label = "Mic-E encoded"
description = "Mic-E format packet (compressed position/status in the destination + info field)"
packet = "NOCALL-7>APZ001,WIDE1-1,WIDE2-1:`kisstty dev test"
