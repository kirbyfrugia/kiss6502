title = "Status"
description = "Status reports, varying body and timestamp"

[[test]]
name = "empty"
label = "Status, empty      "
description = "Status report with no text after the '>' - degenerate/empty-body case"
packet = "NOCALL-3>APZ001,WIDE1-1,WIDE2-1:>"

[[test]]
name = "plain"
label = "Status, plain      "
description = "Status report with text and no timestamp"
packet = "NOCALL-4>APZ001,WIDE1-1,WIDE2-1:>kisstty dev test"

[[test]]
name = "timestamped"
label = "Status, timestamped"
description = "Status report prefixed with a zulu (DDHHMMz) timestamp"
packet = "NOCALL-5>APZ001,WIDE1-1,WIDE2-1:>092345zkisstty dev test"
