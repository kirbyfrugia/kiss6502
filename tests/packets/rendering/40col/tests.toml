# 40-column display rendering. Named by expected OUTCOME (what should render),
# since that's what these verify. Messages are sized around the 40-char
# line-wrap boundary of the 8-bit display.
title = "40-column rendering"
description = "Line-wrapping and boundary behavior at the 40-char display width"

[[test]]
name = "fits-one-line"
label = "Fits one line     "
description = "Short message that fits comfortably on a single display line"
packet = "NOCALL-1>APZ001,WIDE1-1,WIDE2-1::NOCALL   :Test message"

[[test]]
name = "wraps-to-two-lines"
label = "Wraps to two lines"
description = "Message long enough to wrap, ending partway through the second display line"
packet = "NOCALL-2>APZ001,WIDE1-1,WIDE2-1::NOCALL   :This message should end mid line 2, my dude!"

[[test]]
name = "fills-line-exactly"
label = "Fills line exactly"
description = "Boundary case: message ends precisely at the end of the second display line"
packet = "NOCALL-3>APZ001,WIDE1-1,WIDE2-1::NOCALL   :This message should end exactly on the end of line 2 my dude"

[[test]]
name = "wraps-with-ssid-source"
label = "Wraps, SSID source"
description = "Two-line wrapping message from an SSID station (source-field width interacts with wrap)"
packet = "NOCALL-15>APZ001,WIDE1-1,WIDE2-1::NOCALL   :This message should end mid line 2, my dude!"
