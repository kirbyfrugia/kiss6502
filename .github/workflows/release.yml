name: Release

# Builds a Windows MSI, a Linux .deb, a Linux .rpm, and an Atari 8-bit
# release zip, and publishes them to a GitHub Release. See README-RUST.md's
# "Releasing and distributing" section for details.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' platform/rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag v$tag_version does not match platform/rust/Cargo.toml version $cargo_version"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test -p kisstty

  build-windows:
    needs: [check-version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install WiX Toolset binaries
        shell: pwsh
        run: |
          $zip = "wix314-binaries.zip"
          $expectedHash = "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
          if ($actualHash -ne $expectedHash) {
            Write-Error "wix314-binaries.zip checksum mismatch: expected $expectedHash, got $actualHash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath wix314-bin -Force
          echo "$PWD\wix314-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build MSI installer
        # wix/main.wxs references License.rtf with a path relative to the
        # crate directory, so this must run from platform/rust.
        working-directory: platform/rust
        run: cargo wix -p kisstty --nocapture

      - name: Upload MSI artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-installer
          path: target/wix/*.msi

  build-linux:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release -p kisstty

      - name: Build .deb package
        run: cargo deb -p kisstty --no-build

      - name: Build .rpm package
        run: |
          mkdir -p target/generate-rpm
          cargo generate-rpm -p platform/rust -o target/generate-rpm/

      - name: Stage Linux packages
        run: |
          mkdir -p dist-linux
          cp target/debian/*.deb target/generate-rpm/*.rpm dist-linux/

      - name: Upload Linux packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-packages
          path: dist-linux/*

  build-atari:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Build and install cc65
        # Pinned to the same commit already verified to build kisstty
        # locally, rather than tracking HEAD, so the release toolchain is
        # both reproducible and known-good. Ubuntu's packaged cc65 (e.g.
        # 2.18) is too old and fails with "No such scope: 'TextArea'".
        run: |
          git clone https://github.com/cc65/cc65
          cd cc65
          git checkout cc3c40c54e51b2d9a22b63c85c418a2b11763377
          make -j"$(nproc)"
          sudo make install PREFIX=/usr

      - name: Build and install dir2atr
        # Same reasoning as the cc65 pin above: matches the commit already
        # verified to build kisstty locally (dir2atr 0.30-240419).
        run: |
          git clone https://github.com/HiassofT/AtariSIO
          cd AtariSIO
          git checkout d3dee42471c3a84ce8d34d3c19f5721f97cb657e
          cd tools
          make dir2atr
          sudo cp dir2atr /usr/local/bin/

      - name: Restore DOS 2.5 boot files
        # DOS.SYS/DUP.SYS are gitignored (Atari DOS 2.5 isn't ours to
        # redistribute in the repo), so they're base64-encoded repo secrets
        # instead. See README-ATARI.md's "Building" section.
        env:
          ATARI_DOS_SYS_B64: ${{ secrets.ATARI_DOS_SYS_B64 }}
          ATARI_DUP_SYS_B64: ${{ secrets.ATARI_DUP_SYS_B64 }}
        run: |
          mkdir -p 3rdparty/atari/dos25
          printf '%s' "$ATARI_DOS_SYS_B64" | base64 -d > 3rdparty/atari/dos25/DOS.SYS
          printf '%s' "$ATARI_DUP_SYS_B64" | base64 -d > 3rdparty/atari/dos25/DUP.SYS

      - name: Build atari release
        run: make atari

      - name: Stage atari release
        run: |
          mkdir -p dist-atari
          cp build/atari/release/kisstty.xex dist-atari/
          cp build/atari/release/kisstty.atr dist-atari/
          cp README-ATARI.md dist-atari/README.md
          cp README.md dist-atari/README-general.md
          cp LICENSE dist-atari/

      - name: Zip atari release
        run: |
          cd dist-atari
          zip -r "../kisstty-atari-${GITHUB_REF_NAME}.zip" .

      - name: Upload atari artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atari-release
          path: kisstty-atari-*.zip

  release:
    needs: [build-windows, build-linux, build-atari]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - name: Generate checksums
        run: |
          mkdir -p dist/checksums
          for f in dist/windows-installer/*.msi dist/linux-packages/*.deb dist/linux-packages/*.rpm dist/atari-release/*.zip; do
            sha256sum "$f" | awk -v f="$(basename "$f")" '{print $1"  "f}' >> dist/checksums/SHA256SUMS.txt
          done
          cat dist/checksums/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/windows-installer/*.msi
            dist/linux-packages/*.deb
            dist/linux-packages/*.rpm
            dist/atari-release/*.zip
            dist/checksums/SHA256SUMS.txt
          generate_release_notes: true
